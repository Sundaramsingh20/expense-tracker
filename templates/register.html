{% extends "base.html" %}
{% block title %}Register - Expense Tracker{% endblock %}

{% block content %}
<div class="auth-card card">
    <h2>Create account</h2>
    <p class="muted">Start tracking your spending in under a minute.</p>
    <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" minlength="3" required autofocus>

        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" minlength="6" required>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
